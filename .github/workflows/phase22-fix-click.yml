name: Phase 22 click correction

on:
  push:
    branches:
      - m5-phase22-manual-media-playback-ux
    paths:
      - '.github/workflows/phase22-fix-click.yml'
      - 'scripts/phase22_fix_click.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-phase22-manual-media-playback-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply correction
        run: python scripts/phase22_fix_click.py
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reader-speed-playback-ui.js speed-reading-v2.css tests/reader-speed-playback-ui.test.js
          git commit -m 'fix: keep reading-area clicks passive during playback'
          git push
