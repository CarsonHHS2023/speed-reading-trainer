name: Staging PR Preview

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: staging-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Verify staging upload, routing, and Reader continuation contracts
        run: |
          npm run check
          node --test \
            tests/preview-runtime-gating.test.js \
            tests/bookshelf-resumable-upload.test.js \
            tests/bookshelf-direct-upload.test.js \
            tests/bookshelf-upload-capabilities.test.js \
            tests/bookshelf-upload-capabilities-edge.test.js \
            tests/bookshelf-upload-capabilities-boundaries.test.js \
            tests/reader-pdf-window-presentation.test.js \
            tests/reader-presentation.test.js \
            tests/reader-window-continuation.test.js \
            tests/reader-boundary-navigation.test.js \
            tests/reader-windowing.test.js \
            tests/reader-speed-current-batch.test.js

      - name: Prepare exact-head staging Preview
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ['PREVIEW_HEAD_SHA']
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'preview-runtime\.js(?:\?v=[^\"\']+)?',
              f'preview-runtime.js?v={sha}',
              text,
          )
          marker = f'<meta name="reader-staging-preview-head" content="{sha}">'
          if '</head>' in text and 'reader-staging-preview-head' not in text:
              text = text.replace('</head>', f'    {marker}\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Deploy staging PR Preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: preview/staging-pr-${{ github.event.number }}
          keep_files: true

      - name: Verify public staging PR Preview
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          base_url="https://carsonhhs2023.github.io/speed-reading-trainer/preview/staging-pr-${PREVIEW_PR_NUMBER}"
          verified=0
          for attempt in $(seq 1 40); do
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/?v=${PREVIEW_HEAD_SHA}" || true)"
            runtime="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/preview-runtime.js?v=${PREVIEW_HEAD_SHA}" || true)"
            direct="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/bookshelf-direct-upload.js?v=${PREVIEW_HEAD_SHA}" || true)"
            capabilities="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/bookshelf-upload-capabilities.js?v=${PREVIEW_HEAD_SHA}" || true)"
            if [[ "${html}" == *"reader-staging-preview-head\" content=\"${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${runtime}" == *"https://carsonhhs-pdf-ocr-service-staging.hf.space"* ]] \
              && [[ "${runtime}" == *"environment = isStaging ? 'staging' : 'staging-preview'"* ]] \
              && [[ "${runtime}" == *"bookshelf-direct-upload.js"* ]] \
              && [[ "${runtime}" == *"bookshelf-upload-capabilities.js"* ]] \
              && [[ "${direct}" == *"/api/v1/direct-upload-sessions"* ]] \
              && [[ "${capabilities}" == *"/api/v1/upload-capabilities"* ]] \
              && [[ "${capabilities}" == *"CAPABILITY_SCHEMA_VERSION = 1"* ]]; then
              echo "Staging PR Preview verified at exact head ${PREVIEW_HEAD_SHA}."
              verified=1
              break
            fi
            echo "Staging PR Preview is still stale on attempt ${attempt}; waiting 10 seconds..."
            sleep 10
          done
          test "${verified}" = '1'

      # Publishing and public exact-head verification are the actual gates. A
      # GitHub API permission/rate-limit problem must not turn an otherwise valid
      # Preview into a failed build merely because this convenience comment failed.
      - name: Comment PR with staging Preview link
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const previewUrl = `https://carsonhhs2023.github.io/speed-reading-trainer/preview/staging-pr-${prNumber}/?v=${headSha}`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧪 **Staging Preview (exact head ${headSha.slice(0, 12)})**: [Open Staging Preview](${previewUrl})`
            });