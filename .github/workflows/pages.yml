name: Production Pages Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare cache-busted production entrypoint
        env:
          PRODUCTION_HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ["PRODUCTION_HEAD_SHA"]
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          for asset in (
              "reader-page-zoom-pan.css",
              "reader-page-zoom-pan.js",
              "reader-debug-toolbar.js",
              "reader-presentation.js",
              "reader-semantic-layout-refinement.js",
              "training-session-clock.js",
              "reader-resume-lifecycle.js",
          ):
              text = re.sub(
                  rf"{re.escape(asset)}(?:\?v=[^\"']+)?",
                  f"{asset}?v={sha}",
                  text,
              )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Deploy frontend to GitHub Pages root
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          keep_files: true
