name: Temporary Test Space Health Probe

on:
  push:
    branches:
      - agent/upload-auth-lifecycle

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Preview backend is running
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://carsonhhs-pdf-ocr-service-ocrmypdf-test.hf.space'
          health_status=$(curl -sS -o /tmp/health -w '%{http_code}' "$BASE/api/v1/health")
          echo "health_status=$health_status"
          cat /tmp/health
          echo

          printf 'diagnostic only\n' > /tmp/probe.md
          upload_status=$(curl -sS -o /tmp/upload -w '%{http_code}' \
            -H 'Origin: https://carsonhhs2023.github.io' \
            -H 'Authorization: Bearer diagnostic-not-a-valid-app-token' \
            -F 'file=@/tmp/probe.md;filename=probe.md;type=text/markdown' \
            "$BASE/api/v1/upload")
          echo "upload_invalid_status=$upload_status"
          cat /tmp/upload
          echo

          test "$health_status" = '200'
          test "$upload_status" = '400'
