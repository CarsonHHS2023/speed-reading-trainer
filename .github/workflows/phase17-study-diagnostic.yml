name: Phase 17 StudyContext Diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  study-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - "StudyContext orders"
          - "highlight excerpt"
          - "stale records"
          - "malformed or out-of-range"
          - "item count and excerpts"
          - "StudyContext has no persisted"
          - "StudyContext UI loads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-name-pattern="${{ matrix.pattern }}" tests/reader-study-context.test.js