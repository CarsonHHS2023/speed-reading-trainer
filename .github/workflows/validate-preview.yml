name: Validate preview frontend flow

on:
  push:
    branches:
      - preview
    paths:
      - 'index.html'
      - 'reader-node-debug.html'
      - 'preview-runtime.js'
      - 'reader-semantic-page.js'
      - 'reader-semantic-page-integration.js'
      - 'reader-presentation-source-rendering.js'
      - 'reader-presentation-source-rendering.css'
      - 'speed-reading-adapter.js'
      - 'tests/**'
      - 'package.json'
      - 'scripts/validate-preview-runtime.py'
      - '.github/workflows/validate-preview.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'reader-node-debug.html'
      - 'preview-runtime.js'
      - 'reader-semantic-page.js'
      - 'reader-semantic-page-integration.js'
      - 'reader-presentation-source-rendering.js'
      - 'reader-presentation-source-rendering.css'
      - 'speed-reading-adapter.js'
      - 'tests/**'
      - 'package.json'
      - 'scripts/validate-preview-runtime.py'
      - '.github/workflows/validate-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview runtime
        run: |
          python -m py_compile scripts/validate-preview-runtime.py
          python scripts/validate-preview-runtime.py
      - name: Validate JavaScript and tests
        run: |
          npm run check
          npm test
