name: Reader v2 Client CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-v2-client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-v2-client:
    name: Reader v2 client, presentation, playback, asset, cutover, find, and resume tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax checks
        run: npm run check

      - name: Reader v2 client/presentation/playback/asset/cutover/find/resume tests
        run: npm test

      - name: Reader v2 boundary check
        run: |
          test -f reader-api.js
          test -f reader-model.js
          test -f reader-presentation.js
          test -f reader-assets.js
          test -f reader-find.js
          test -f reader-resume.js
          test -f reader-resume-lifecycle.js
          test -f reader-ui-v2.js
          test -f speed-reading-adapter.js
          test -f playback-controller.js
          test -f reader-speed-playback-ui.js
          test -f reader-v2.css
          test ! -e reader-bookshelf-cutover.js
          grep -q 'readerV2Display' index.html
          grep -q 'reader-assets.js' index.html
          grep -q 'reader-find.js' index.html
          grep -q 'reader-resume.js' index.html
          grep -q 'reader-resume-lifecycle.js' index.html
          grep -q 'readerV2FindInput' index.html
          grep -q 'speed-reading-adapter.js' index.html
          grep -q 'playback-controller.js' index.html
          grep -q 'reader-speed-playback-ui.js' index.html
          ! grep -q 'reader-bookshelf-cutover.js' index.html
          ! grep -q '/api/reader/v1' reader-api.js
          ! grep -q '/api/v1/books/' reader-api.js
          ! grep -q '/api/v1/books/' reader-find.js
          ! grep -q '/api/reader/v1' reader-find.js
          ! grep -q 'cachedContentBlob' reader-find.js
          ! grep -q 'state.content' reader-find.js
          ! grep -q 'tokenizeContent' reader-find.js
          ! grep -q 'page_id' reader-find.js
          ! grep -q 'presentation_id' reader-find.js
          ! grep -q '/api/reader/v1' reader-resume.js
          ! grep -q '/api/v1/books/' reader-resume.js
          ! grep -q 'cachedContentBlob' reader-resume.js
          ! grep -q 'state.content' reader-resume.js
          ! grep -q 'tokenizeContent' reader-resume.js
          ! grep -q 'page_id' reader-resume.js
          ! grep -q 'presentation_id' reader-resume.js
          ! grep -q '/api/v1/images/' reader-assets.js
          ! grep -q 'artifact_ref' reader-assets.js
          ! grep -q 'storage_ref' reader-assets.js
          ! grep -q 'page_id' reader-model.js
          ! grep -q 'page_order' reader-model.js
          ! grep -q '/api/v1/books/.*/content' bookshelf.js
          ! grep -q 'BookShelf.prototype.selectBook' bookshelf.js
          ! grep -q '/api/v1/books/' reader-speed-playback-ui.js
          ! grep -q 'cachedContentBlob' reader-speed-playback-ui.js
          ! grep -q 'tokenizeContent' reader-speed-playback-ui.js
          ! grep -q 'imageMarkerMap' reader-speed-playback-ui.js
          ! grep -q 'readerModeToggle' index.html
