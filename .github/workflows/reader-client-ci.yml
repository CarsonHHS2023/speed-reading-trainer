name: Reader Client CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-client:
    name: Reader contract and client tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax checks
        run: npm run check

      - name: Reader client tests
        run: npm test

      - name: Required Reader shell files
        run: |
          test -f reader-api.js
          test -f reader-model.js
          test -f reader-ui.js
          test -f reader.css
          grep -q 'readerModeToggle' index.html
          grep -q 'structuredReader' index.html
