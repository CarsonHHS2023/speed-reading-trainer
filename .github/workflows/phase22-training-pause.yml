name: Phase 22 dual pause transform

on:
  push:
    branches:
      - m5-phase22-manual-media-playback-ux
    paths:
      - '.github/workflows/phase22-training-pause.yml'
      - 'scripts/phase22_training_pause.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-phase22-manual-media-playback-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply dual-pause semantics
        run: python scripts/phase22_training_pause.py
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reader-speed-playback-ui.js index.html
          git commit -m 'feat: separate comprehension pause from training pause'
          git push
