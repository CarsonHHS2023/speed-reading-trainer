name: Preview Deployment

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare cache-busted Preview entrypoint
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ["PREVIEW_HEAD_SHA"]
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          for asset in (
              "reader-page-zoom-pan.css",
              "reader-page-zoom-pan.js",
              "reader-debug-toolbar.js",
              "reader-presentation.js",
              "reader-semantic-layout-refinement.js",
              "training-session-clock.js",
              "reader-resume-lifecycle.js",
          ):
              text = re.sub(
                  rf"{re.escape(asset)}(?:\?v=[^\"']+)?",
                  f"{asset}?v={sha}",
                  text,
              )
          marker = f'<meta name="reader-preview-head" content="{sha}">' 
          if "</head>" in text and "reader-preview-head" not in text:
              text = text.replace("</head>", f"    {marker}\n</head>", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Deploy to GitHub Pages (PR Preview)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: preview/pr-${{ github.event.number }}
          keep_files: true

      - name: Verify public Preview matches exact head
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          base_url="https://carsonhhs2023.github.io/speed-reading-trainer/preview/pr-${PREVIEW_PR_NUMBER}"
          verified=0
          for attempt in $(seq 1 40); do
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/?v=${PREVIEW_HEAD_SHA}" || true)"
            js="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-debug-toolbar.js?v=${PREVIEW_HEAD_SHA}" || true)"
            presentation="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-presentation.js?v=${PREVIEW_HEAD_SHA}" || true)"
            refinement="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-semantic-layout-refinement.js?v=${PREVIEW_HEAD_SHA}" || true)"
            edge_polish="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-semantic-layout-edge-polish.js?v=${PREVIEW_HEAD_SHA}" || true)"
            training_clock="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/training-session-clock.js?v=${PREVIEW_HEAD_SHA}" || true)"
            lifecycle="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-resume-lifecycle.js?v=${PREVIEW_HEAD_SHA}" || true)"
            structure_policy="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/speed-reading-structure-policy.js?v=${PREVIEW_HEAD_SHA}" || true)"
            speed_layout="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/speed-reading-responsive-layout.js?v=${PREVIEW_HEAD_SHA}" || true)"
            punctuation_policy="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/reader-punctuation-hanging-policy.js?v=${PREVIEW_HEAD_SHA}" || true)"
            formula_rendering="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/speed-reading-formula-rendering.js?v=${PREVIEW_HEAD_SHA}" || true)"
            layout_integrity="$(curl -fsSL --retry 2 --retry-delay 1 "${base_url}/speed-reading-layout-integrity.js?v=${PREVIEW_HEAD_SHA}" || true)"
            if [[ "${html}" == *"reader-preview-head\" content=\"${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${html}" == *"reader-debug-toolbar.js?v=${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${html}" == *"reader-semantic-layout-refinement.js?v=${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${html}" == *"training-session-clock.js?v=${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${html}" == *"reader-resume-lifecycle.js?v=${PREVIEW_HEAD_SHA}"* ]] \
              && [[ "${js}" == *"BOOKLIST_CONTROLS_CLASS"* ]] \
              && [[ "${js}" == *"恢复到100%"* ]] \
              && [[ "${presentation}" == *"reader-semantic-layout-edge-polish.js"* ]] \
              && [[ "${presentation}" == *"reader-preview-head"* ]] \
              && [[ "${refinement}" == *"BODY_FONT_PX = 18"* ]] \
              && [[ "${refinement}" == *"pairInlineRows"* ]] \
              && [[ "${edge_polish}" == *"INLINE_ROW_MIN_GAP_PX = 8"* ]] \
              && [[ "${edge_polish}" == *"HEADER_BODY_GAP_PX = 16"* ]] \
              && [[ "${edge_polish}" == *"canonicalFurnitureBaseHeight"* ]] \
              && [[ "${edge_polish}" == *"readerHeaderSingleLine"* ]] \
              && [[ "${training_clock}" == *"ReaderTrainingSessionClock"* ]] \
              && [[ "${training_clock}" == *"TrainingSessionClock"* ]] \
              && [[ "${training_clock}" != *"speed-reading-responsive-layout.js"* ]] \
              && [[ "${training_clock}" != *"data-reader-enhancement"* ]] \
              && [[ "${lifecycle}" == *"meta[name=\"reader-preview-head\"]"* ]] \
              && [[ "${lifecycle}" == *"currentScriptAssetVersion"* ]] \
              && [[ "${lifecycle}" == *"ENTRYPOINT_ASSET_VERSION"* ]] \
              && [[ "${lifecycle}" == *"versionedAsset"* ]] \
              && [[ "${lifecycle}" == *"script.dataset.readerEnhancement = src"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-structure-policy.js"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-formula-rendering.js"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-responsive-layout.js"* ]] \
              && [[ "${lifecycle}" == *"reader-punctuation-hanging-policy.js"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-layout-integrity.js"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-block-layout-policy.js"* ]] \
              && [[ "${lifecycle}" == *"speed-reading-speed-policy.js"* ]] \
              && [[ "${structure_policy}" == *"inline_formula: 'paragraph'"* ]] \
              && [[ "${structure_policy}" == *"providerType === 'inline_formula'"* ]] \
              && [[ "${structure_policy}" == *"table_title: 'caption'"* ]] \
              && [[ "${structure_policy}" == *"BROAD_SEMANTIC_TYPES"* ]] \
              && [[ "${structure_policy}" == *"preferCanonicalPdfVisualAssetRefs"* ]] \
              && [[ "${structure_policy}" == *"SPEED_READING_EXCLUDED_PRESENTATION_KINDS"* ]] \
              && [[ "${structure_policy}" == *"Chapter dividers are intentionally NOT excluded"* ]] \
              && [[ "${speed_layout}" == *"MIN_WIDTH_PERCENT = 20"* ]] \
              && [[ "${speed_layout}" == *"splitMeasuredLineIntoBlocks"* ]] \
              && [[ "${speed_layout}" == *"pageLineCapacity"* ]] \
              && [[ "${speed_layout}" == *"isClosingPunctuationToken(token)"* ]] \
              && [[ "${speed_layout}" != *"moveTrailingTokenToNextLine"* ]] \
              && [[ "${punctuation_policy}" == *"sameLogicalTextSource"* ]] \
              && [[ "${punctuation_policy}" == *"HARD_STRUCTURE_TYPES"* ]] \
              && [[ "${punctuation_policy}" == *"refreshFrameTiming"* ]] \
              && [[ "${punctuation_policy}" == *"LEADING_CLOSING_PUNCTUATION"* ]] \
              && [[ "${punctuation_policy}" != *"CARRIED_CHARACTER_AND_PUNCTUATION"* ]] \
              && [[ "${formula_rendering}" == *"INLINE_FORMULA_KIND = 'inline_formula'"* ]] \
              && [[ "${formula_rendering}" == *"displayMode: false"* ]] \
              && [[ "${formula_rendering}" == *"renderFormulaInto"* ]] \
              && [[ "${formula_rendering}" == *"rendererChainReady"* ]] \
              && [[ "${layout_integrity}" == *"canonicalCaptionAssociations"* ]] \
              && [[ "${layout_integrity}" == *"same_page_spatial_visual_v1_frontend_fallback"* ]] \
              && [[ "${layout_integrity}" == *"CAPTION_VISUAL_MAX_VERTICAL_GAP = 0.18"* ]] \
              && [[ "${layout_integrity}" == *"CAPTION_VISUAL_MIN_HORIZONTAL_OVERLAP = 0.40"* ]] \
              && [[ "${layout_integrity}" == *"CAPTION_VISUAL_AMBIGUITY_MARGIN = 0.025"* ]] \
              && [[ "${layout_integrity}" == *"sourceUnitIdForNode"* ]] \
              && [[ "${layout_integrity}" == *"normalizedSpatialAnchor"* ]] \
              && [[ "${layout_integrity}" == *"captionVisualMetrics"* ]] \
              && [[ "${layout_integrity}" == *"fallbackBoundVisualIds"* ]] \
              && [[ "${layout_integrity}" == *"unresolvedCaptionIds"* ]] \
              && [[ "${layout_integrity}" != *"canonical_shared_parent_unique_visual"* ]] \
              && [[ "${layout_integrity}" != *"canonical_visual_parent_unique_child"* ]] \
              && [[ "${layout_integrity}" == *"lineFrameCapacity"* ]] \
              && [[ "${layout_integrity}" == *"applySafeHorizontalInset"* ]] \
              && [[ "${layout_integrity}" == *"withPlaybackElementPolicy"* ]] \
              && [[ "${layout_integrity}" == *"GLYPH_BLEED_PX = 6"* ]] \
              && [[ "${layout_integrity}" == *"relaxTimedTextClipping"* ]] \
              && [[ "${layout_integrity}" == *"parent_ref"* ]]; then
              echo "Public Preview verified at exact head ${PREVIEW_HEAD_SHA} on attempt ${attempt}."
              verified=1
              break
            fi
            echo "Public Preview is still stale on attempt ${attempt}; waiting 10 seconds..."
            sleep 10
          done
          if [[ "${verified}" != "1" ]]; then
            echo "Public Preview did not publish exact head ${PREVIEW_HEAD_SHA} within the verification window." >&2
            exit 1
          fi

      - name: Comment PR with preview link
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;
            const previewUrl = `https://carsonhhs2023.github.io/speed-reading-trainer/preview/pr-${prNumber}/?v=${headSha}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 **Preview (exact head ${headSha.slice(0, 12)})**: [View PR Preview](${previewUrl})`
            });