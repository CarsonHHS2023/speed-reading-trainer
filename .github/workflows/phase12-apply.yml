name: Phase 12 apply

on:
  push:
    branches: [ m5-phase12-clean-reader-v2-cutover ]
    paths:
      - scripts/phase12_apply.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-phase12-clean-reader-v2-cutover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 12 transform
        run: python scripts/phase12_apply.py
      - name: Commit transformed bookshelf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookshelf.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make bookshelf selection Reader v2 native"
          git push origin HEAD:m5-phase12-clean-reader-v2-cutover
